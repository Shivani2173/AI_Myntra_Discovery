[project]
name = "ai-discovery-engine"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "praw>=7.7.0",
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
minilm = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
