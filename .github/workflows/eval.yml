name: Gold-set eval

on:
  push:
    paths:
      - "eval/**"
      - "backend/llm.py"
      - "backend/taxonomy.py"
      - "backend/relevance.py"
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install .
          pip install pytest
      - name: Build gold set if missing rows
        run: python eval/build_gold_set.py
      - name: Score with stub predictor
        run: python -m eval.score --predict stub
      - name: Unit tests
        run: pytest -q
